name: CI

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**/*.cpp'
      - 'include/**/*.h'
      - 'test/**/*.cpp'
      - 'script/**/*.py'
      - 'tests/**/*.py'
      - 'CMakeLists.txt'
      - 'requirements.txt'
      - 'justfile'
      - 'pyproject.toml'
  # Keep the expensive full sweep out of every ordinary push.  The monthly
  # run below is the repository-wide integration safety net.
  schedule:
    - cron: '0 2 1 * *'
  workflow_dispatch:
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'src/**/*.cpp'
      - 'include/**/*.h'
      - 'test/**/*.cpp'
      - 'script/**/*.py'
      - 'tests/**/*.py'
      - 'CMakeLists.txt'
      - 'requirements.txt'
      - 'justfile'
      - 'pyproject.toml'

# Cancel redundant workflows
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python Unit Tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.python_changed == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python3 -m compileall -q script tests

      - name: Lint Python
        run: |
          python3 -m ruff check script tests

      - name: Run Python unit tests
        run: |
          python3 -m pytest tests script/ci/check_leetcode_cookie.py -q

  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      problems: ${{ steps.detect.outputs.problems }}
      problem_count: ${{ steps.detect.outputs.problem_count }}
      core_changed: ${{ steps.detect.outputs.core_changed }}
      python_changed: ${{ steps.detect.outputs.python_changed }}
      is_full_build: ${{ steps.strategy.outputs.is_full_build }}
      build_type: ${{ steps.strategy.outputs.build_type }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore file timestamps
        uses: chetan/git-restore-mtime-action@v2

      - name: Detect changed problems
        id: detect
        run: |
          CHANGED_PROBLEMS=$(python3 script/ci/detect_changed_problems.py origin/main)
          PROBLEM_COUNT=$(echo "$CHANGED_PROBLEMS" | tr ';' '\n' | grep -c '^' || true)
          
          echo "problems=$CHANGED_PROBLEMS" >> $GITHUB_OUTPUT
          echo "problem_count=$PROBLEM_COUNT" >> $GITHUB_OUTPUT

          # On a direct push to the default branch origin/main may already
          # point at HEAD, so fall back to the files in the pushed commit.
          CHANGED_FILES=$(git diff --name-only origin/main HEAD || true)
          if [ -z "$CHANGED_FILES" ]; then
            CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r -m HEAD || true)
          fi

          if printf '%s\n' "$CHANGED_FILES" | grep -Eq '^(CMakeLists\.txt|include/leetcode/(core|solution)\.(h|hpp)|include/leetcode/utils/|src/leetcode/utils/)'; then
            echo "core_changed=true" >> $GITHUB_OUTPUT
          else
            echo "core_changed=false" >> $GITHUB_OUTPUT
          fi

          if printf '%s\n' "$CHANGED_FILES" | grep -Eq '^(script/|tests/|requirements\.txt$|pyproject\.toml$)'; then
            echo "python_changed=true" >> $GITHUB_OUTPUT
          else
            echo "python_changed=false" >> $GITHUB_OUTPUT
          fi

          echo "Detected $PROBLEM_COUNT changed problem(s)"

      - name: Determine build strategy
        id: strategy
        run: |
          EVENT_NAME="${{ github.event_name }}"
          PROBLEM_COUNT="${{ steps.detect.outputs.problem_count }}"
          CORE_CHANGED="${{ steps.detect.outputs.core_changed }}"
          
          if [ "$EVENT_NAME" == "schedule" ] || [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            echo "is_full_build=true" >> $GITHUB_OUTPUT
            echo "build_type=full" >> $GITHUB_OUTPUT
            echo "Scheduled/manual repository-wide audit"
          elif [ "$CORE_CHANGED" == "true" ]; then
            echo "is_full_build=true" >> $GITHUB_OUTPUT
            echo "build_type=full" >> $GITHUB_OUTPUT
            echo "Core build files changed, using full build"
          elif [ "$PROBLEM_COUNT" -gt 50 ]; then
            # A very large batch is still unusual; keep a full-build fallback
            # while ordinary generated batches use the cheaper multi target.
            if [ "$EVENT_NAME" == "pull_request" ] || [ "$EVENT_NAME" == "push" ]; then
              echo "is_full_build=true" >> $GITHUB_OUTPUT
              echo "build_type=full" >> $GITHUB_OUTPUT
              echo "Large batch ($PROBLEM_COUNT problems), using full build"
            fi
          elif [ "$PROBLEM_COUNT" -gt 0 ]; then
            echo "is_full_build=false" >> $GITHUB_OUTPUT
            echo "build_type=incremental" >> $GITHUB_OUTPUT
            echo "Using incremental build for $PROBLEM_COUNT problem(s)"
          else
            echo "is_full_build=false" >> $GITHUB_OUTPUT
            echo "build_type=skip" >> $GITHUB_OUTPUT
            echo "No changed problems or core build files, skipping C++ build"
          fi

  build-incremental:
    name: Incremental Build
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.build_type == 'incremental' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore file timestamps
        uses: chetan/git-restore-mtime-action@v2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential ccache ninja-build python3 gcc g++

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          # Use problem list in key for incremental builds
          # This allows separate caches for different PRs but share within same problems
          key: ${{ runner.os }}-gcc-incremental-${{ hashFiles('CMakeLists.txt') }}-${{ needs.detect-changes.outputs.problems }}
          restore-keys: |
            ${{ runner.os }}-gcc-incremental-${{ hashFiles('CMakeLists.txt') }}-
            ${{ runner.os }}-gcc-incremental-
            ${{ runner.os }}-gcc-full-
            ${{ runner.os }}-gcc-
          max-size: 500M

      - name: Setup ccache symlinks
        run: |
          sudo mkdir -p /usr/local/lib/ccache
          sudo ln -sf $(which ccache) /usr/local/lib/ccache/gcc
          sudo ln -sf $(which ccache) /usr/local/lib/ccache/g++
          sudo ln -sf $(which ccache) /usr/local/lib/ccache/cc
          sudo ln -sf $(which ccache) /usr/local/lib/ccache/c++
          echo "/usr/local/lib/ccache" >> $GITHUB_PATH
          ccache --set-config=sloppiness=pch_defines,time_macros,include_file_mtime,include_file_ctime
          ccache -s

      - name: Build changed problems
        run: |
          PROBLEMS="${{ needs.detect-changes.outputs.problems }}"
          echo "Building problems: $PROBLEMS"
          
          mkdir -p build && cd build
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=/usr/local/lib/ccache/gcc \
            -DCMAKE_CXX_COMPILER=/usr/local/lib/ccache/g++ \
            -DLEETCODE_MULTI_PROBLEMS="$PROBLEMS"
          cmake --build . -j
          ccache -s

      - name: Run tests
        working-directory: build
        run: ./bin/multi_problem_test

  build-full:
    name: Full Build
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.build_type == 'full' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore file timestamps
        uses: chetan/git-restore-mtime-action@v2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential ccache ninja-build python3 gcc g++ clang lld

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          # Full build cache - most comprehensive, used as fallback for all builds
          key: ${{ runner.os }}-clang-unity-full-${{ hashFiles('CMakeLists.txt', 'src/leetcode/utils/*.cpp', 'include/leetcode/*.h') }}
          restore-keys: |
            ${{ runner.os }}-clang-unity-full-
            ${{ runner.os }}-clang-
          max-size: 500M

      - name: Setup ccache symlinks
        run: |
          # Create ccache symlinks to intercept all compiler calls (including FetchContent)
          sudo mkdir -p /usr/local/lib/ccache
          sudo ln -sf $(which ccache) /usr/local/lib/ccache/gcc
          sudo ln -sf $(which ccache) /usr/local/lib/ccache/g++
          sudo ln -sf $(which ccache) /usr/local/lib/ccache/cc
          sudo ln -sf $(which ccache) /usr/local/lib/ccache/c++
          echo "/usr/local/lib/ccache" >> $GITHUB_PATH
          ccache --set-config=sloppiness=pch_defines,time_macros,include_file_mtime,include_file_ctime
          ccache -s

      - name: Build project
        run: |
          mkdir -p build && cd build
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld" \
            -DCMAKE_UNITY_BUILD=ON \
            -DCMAKE_UNITY_BUILD_BATCH_SIZE=32
          cmake --build . -j
          ccache -s

      - name: Run all tests
        working-directory: build
        run: ctest --output-on-failure
